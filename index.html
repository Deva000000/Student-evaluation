<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassInsights — Gradebook, Syllabus & Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root{
    --paper:#fdfbf7; --card:#ffffff; --ink:#1f2421; --muted:#6b6f6a;
    --line:#e7e2d8; --teal:#2f6f5e; --teal-d:#235447; --gold:#b4862b;
    --soft:#f3efe6; --danger:#b3402f; --ok:#2f6f5e; --warn:#b4862b;
    --shadow:0 1px 2px rgba(31,36,33,.05),0 6px 24px rgba(31,36,33,.06);
    --radius:14px; --head-bg:rgba(253,251,247,.92);
  }
  body[data-theme="dark"]{
    --paper:#14171a;--card:#1d2126;--ink:#ecebe4;--muted:#9aa0a0;--line:#2b3036;
    --soft:#22272d;--teal:#4f9e88;--teal-d:#3f8270;--gold:#d2a24a;--danger:#e07a63;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 28px rgba(0,0,0,.4);
    --head-bg:rgba(20,23,26,.92);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;letter-spacing:-.01em;margin:0}
  a{color:var(--teal)}
  .wrap{max-width:1140px;margin:0 auto;padding:0 22px}
  header.app{position:sticky;top:0;z-index:30;background:var(--head-bg);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .head-row{display:flex;align-items:center;gap:18px;padding:10px 0}
  .brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .brand .mark{font-family:"Fraunces",serif;font-size:23px;font-weight:700;color:var(--teal)}
  .brand .mark b{color:var(--gold)}
  .brand small{color:var(--muted);font-size:12px}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .ctxbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 0 11px}
  .ctxbar select{padding:6px 12px;min-width:150px;font-size:13px;cursor:pointer}
  .ctxlabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  .ctxlabel:not(:first-child){margin-left:6px}
  nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
  nav.tabs button{background:none;border:none;font:inherit;font-weight:600;color:var(--muted);padding:12px 16px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  nav.tabs button:hover{color:var(--ink)}
  nav.tabs button.active{color:var(--teal);border-bottom-color:var(--teal)}
  main{padding:26px 0 80px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h2{font-size:26px}
  .page-head p{color:var(--muted);margin:4px 0 0;max-width:60ch}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:18px}
  .card h3{font-size:18px;margin-bottom:4px}
  .card .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .grid{display:grid;gap:18px}
  .grid.two{grid-template-columns:1fr 1fr}
  .grid.cards{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
  @media(max-width:760px){.grid.two{grid-template-columns:1fr}}
  label.fld{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
  input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{
    width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:9px 11px;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(47,111,94,.12)}
  textarea{resize:vertical;min-height:80px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .row>div{flex:1;min-width:140px}
  .btn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:600;border-radius:10px;padding:9px 16px;border:1px solid var(--teal);background:var(--teal);color:#fff;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--teal-d);border-color:var(--teal-d)}
  .btn.ghost{background:transparent;color:var(--teal)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.gray{background:var(--soft);color:var(--ink);border-color:var(--line)}
  .btn.gray:hover{background:var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border-color:transparent}
  .btn.danger:hover{background:rgba(179,64,47,.1)}
  .iconbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--muted);font-size:14px;display:inline-flex;align-items:center;justify-content:center}
  .iconbtn:hover{color:var(--ink);background:var(--soft)}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
  td.num input{text-align:center;padding:7px 4px}
  .mark-grade{font-weight:700;font-family:"Fraunces",serif}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
  .pill.covered{background:#eaf3ef;color:var(--teal-d);border-color:#cfe5dc}
  .pill.upcoming{background:#fdf6e7;color:#7a5a14;border-color:#efe0bd}
  .pill.missed{background:#f9ece9;color:#8d2e21;border-color:#eccfca}
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat .v{font-family:"Fraunces",serif;font-size:30px;font-weight:600;line-height:1}
  .stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:18px}
  .progress{height:10px;background:var(--soft);border-radius:999px;overflow:hidden}
  .progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:999px}
  .empty{text-align:center;color:var(--muted);padding:34px 20px;border:1px dashed var(--line);border-radius:var(--radius);background:var(--card)}
  .empty h3{color:var(--ink);margin-bottom:6px}
  .badge{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;letter-spacing:.08em}
  .muted{color:var(--muted)}
  .right{text-align:right}
  .nowrap{white-space:nowrap}
  .tag{display:inline-block;font-size:12px;color:var(--muted);background:var(--soft);padding:2px 8px;border-radius:6px}
  .hide{display:none!important}
  .flex{display:flex;gap:10px;align-items:center}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .scroll{overflow:auto}
  hr.sep{border:none;border-top:1px solid var(--line);margin:18px 0}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#23272d;color:#f5f3ec;padding:11px 18px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);z-index:60;opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1}
  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:12px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:6px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  .avatar{width:38px;height:38px;border-radius:50%;background:var(--soft);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-weight:700;color:var(--teal);overflow:hidden;cursor:pointer;font-family:"Fraunces",serif}
  .avatar img{width:100%;height:100%;object-fit:cover}
  .avatar.lg{width:84px;height:84px;font-size:30px;cursor:default}
  #gate{display:none;position:fixed;inset:0;z-index:100;background:var(--paper);align-items:center;justify-content:center;padding:24px}
  body.gated header.app,body.gated main{display:none}
  .gatecard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:30px}
  .gatecard .mark{font-family:"Fraunces",serif;font-size:30px;font-weight:700;color:var(--teal)}
  .gatecard .mark b{color:var(--gold)}
  .gatecard h3{margin:16px 0 4px;font-size:20px}
  .gatecard .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
  .gatecard label.fld{margin-top:12px}
  .gateerr{color:var(--danger);font-size:13px;margin-top:10px;min-height:18px}
  .linkbtn{background:none;border:none;color:var(--muted);font:inherit;text-decoration:underline;cursor:pointer;font-size:12px;padding:0}
  /* dashboard + motion */
  #main>*{animation:fadeUp .35s ease both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card.lift,.tile{transition:transform .18s ease,box-shadow .18s ease}
  .card.lift:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(31,36,33,.13)}
  .hero{position:relative;overflow:hidden;border-radius:18px;padding:28px;margin-bottom:20px;color:#fff;background:linear-gradient(135deg,var(--teal),var(--teal-d));box-shadow:var(--shadow)}
  .hero h2{color:#fff;font-size:30px}
  .hero p{color:rgba(255,255,255,.88);margin:8px 0 0;max-width:60ch}
  .hero .deco{position:absolute;border-radius:50%;pointer-events:none}
  .hero .deco.a{right:-50px;top:-50px;width:220px;height:220px;background:rgba(255,255,255,.08)}
  .hero .deco.b{right:90px;bottom:-70px;width:150px;height:150px;background:rgba(255,255,255,.06)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:18px}
  .tile{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:16px;padding:22px 20px 20px;background:var(--card);box-shadow:var(--shadow)}
  .tile:hover{transform:translateY(-3px);box-shadow:0 14px 32px rgba(31,36,33,.13)}
  .tile .bar{position:absolute;left:0;top:0;height:4px;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2))}
  .tile .v{font-family:"Fraunces",serif;font-size:36px;font-weight:600;line-height:1;margin-top:4px}
  .tile .k{color:var(--muted);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.06em}
  .tile::after{content:"";position:absolute;right:-30px;bottom:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,var(--c2),transparent 70%);opacity:.16}
  .hero-cov{margin-top:16px;font-size:13px;line-height:1.7;color:rgba(255,255,255,.92);background:rgba(255,255,255,.12);padding:11px 15px;border-radius:11px}
  .hero-cov b{color:#ffe6a8}
  .rankbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-weight:700;font-size:13px;background:var(--soft);color:var(--muted)}
  .rankbadge.r1{background:linear-gradient(135deg,#e3b341,#f6d873);color:#5b4708}
  .rankbadge.r2{background:linear-gradient(135deg,#b9c0c8,#dfe4e8);color:#3c4248}
  .rankbadge.r3{background:linear-gradient(135deg,#c98a4b,#e0a567);color:#4a2d10}
  tr.rank-top td{background:var(--soft)}
</style>
</head>
<body>
<header class="app">
  <div class="wrap">
    <div class="head-row">
      <div class="brand">
        <span id="hdrAvatar" class="avatar" onclick="setTab('settings')" title="Settings"></span>
        <span class="mark">Class<b>Insights</b></span>
      </div>
      <div class="head-actions">
        <button class="iconbtn" id="themeBtn" title="Toggle theme" onclick="toggleTheme()">🌙</button>
        <button class="iconbtn" title="Lock app" onclick="lockApp()">🔒</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
    <div class="ctxbar">
      <span class="ctxlabel">Class</span>
      <select id="stdSel" onchange="setActiveStandard(this.value)"></select>
      <span class="ctxlabel">Subject</span>
      <select id="subjSel" onchange="setActiveSubject(this.value)"></select>
    </div>
  </div>
</header>
<main><div class="wrap" id="main"></div></main>
<div id="gate"></div>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ClassInsights — local single-file teacher app.
   Hierarchy: Class (standard) > Subject > Student.
   Data persists in this browser (localStorage). Login is a
   local device lock. Subscription gate here is a FRONT-END
   DEMO — real billing must be verified by a server.
   ============================================================ */
const STORE="classtrack_v1";
const DEFAULT_ELEMENTS=["Reading","Listening","Writing","Thinking","Communication"];
const SEED_LIBRARY=["Reading","Listening","Writing","Speaking","Thinking","Communication","Grammar","Vocabulary","Comprehension","Problem Solving","Calculation","Reasoning","Practical / Experiment","Participation","Homework","Project"];
const PALETTE=["#2f6f5e","#b4862b","#3b6ea5","#8a52a8","#c0552d","#1f8a70","#a23b72","#5b7c2a","#0e7c86","#9c3848"];
const AVG_COLOR="#1f2421";
const BANDS=[
  {min:80,grade:"A",label:"Excellent"},
  {min:65,grade:"B",label:"Good"},
  {min:50,grade:"C",label:"Satisfactory"},
  {min:35,grade:"D",label:"Needs Improvement"},
  {min:0, grade:"E",label:"Below Expectations"},
];

function defaults(){
  return {
    settings:{ schoolName:"", teacherName:"", maxScore:10, theme:"light", phone:"", dp:"" },
    auth:null,                  // {username,salt,method,hash}
    license:{ activeUntil:null },// ISO date access is paid through (DEMO)
    elementLibrary:SEED_LIBRARY.map(l=>({key:slug(l),label:l})),
    standards:[],               // {id,name,students:[{id,name,parent}],subjects:[{id,name,syllabus:[],elements:[{key,label,weight}]}]}
    evals:[],                   // {id,standardId,subjectId,studentId,date,session,scores,comment,topicId}
    ui:{ activeStandardId:null, activeSubjectId:null, tab:"dashboard", trendStudent:null }
  };
}
function load(){
  try{
    const s=JSON.parse(localStorage.getItem(STORE));
    if(!s) return defaults();
    const st=Object.assign(defaults(),s);
    // migrate old (subjects at top level) -> standards
    if(s.subjects && !s.standards){
      const mkid=()=>Math.random().toString(36).slice(2,9);
      const std={id:mkid(),name:"My Class",students:[],subjects:[]};
      const byName={};
      (s.subjects||[]).forEach(sub=>{
        std.subjects.push({id:sub.id,name:sub.name,syllabus:sub.syllabus||[],elements:makeDefaultElements()});
        (sub.students||[]).forEach(stu=>{
          let nid=byName[stu.name];
          if(!nid){ std.students.push({id:stu.id,name:stu.name,parent:stu.parent||""}); byName[stu.name]=stu.id; nid=stu.id; }
          (st.evals||[]).forEach(e=>{ if(e.subjectId===sub.id && e.studentId===stu.id){ e.standardId=std.id; e.studentId=nid; } });
        });
      });
      st.standards=[std]; delete st.subjects;
      st.ui.activeStandardId=std.id; st.ui.activeSubjectId=std.subjects[0]?.id||null;
    }
    if(!st.elementLibrary||!st.elementLibrary.length) st.elementLibrary=SEED_LIBRARY.map(l=>({key:slug(l),label:l}));
    (st.standards||[]).forEach(std=>(std.subjects||[]).forEach(sub=>{ if(!sub.elements||!sub.elements.length) sub.elements=makeDefaultElements(); }));
    return st;
  }catch(e){ return defaults(); }
}
function save(){ try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){toast("Could not save — storage blocked");} }

let state=load();

/* ---------- helpers ---------- */
const uid=()=>Math.random().toString(36).slice(2,9);
const $=sel=>document.querySelector(sel);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
function fmt(d){ if(!d)return ""; return new Date(d+"T00:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}); }
function clampScore(v){ const m=state.settings.maxScore; v=Number(v); if(isNaN(v))return 0; return Math.max(0,Math.min(m,v)); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"")||("el_"+Math.random().toString(36).slice(2,6)); }
function makeDefaultElements(){ const n=DEFAULT_ELEMENTS.length, base=Math.floor(100/n); const arr=DEFAULT_ELEMENTS.map(l=>({key:slug(l),label:l,weight:base})); arr[0].weight+=100-base*n; return arr; }
function elsOf(sub){ return (sub&&sub.elements&&sub.elements.length)?sub.elements:makeDefaultElements(); }
const elColor=i=>PALETTE[i%PALETTE.length];
// Weighted marking percentage over the elements actually recorded in this score set.
function pctFor(scores,elements){
  const m=state.settings.maxScore;
  const els=elements.filter(e=>Object.prototype.hasOwnProperty.call(scores,e.key));
  if(!els.length) return 0;
  const tw=els.reduce((a,e)=>a+(Number(e.weight)||0),0);
  if(tw<=0){ const n=els.length, s=els.reduce((a,e)=>a+(Number(scores[e.key])||0),0); return Math.round((s/(m*n))*1000)/10; }
  const acc=els.reduce((a,e)=>a+((Number(scores[e.key])||0)/m)*(Number(e.weight)||0),0);
  return Math.round((acc/tw)*1000)/10;
}
function gradeFor(p){ return BANDS.find(b=>p>=b.min)||BANDS[BANDS.length-1]; }
function activeStandard(){ return state.standards.find(s=>s.id===state.ui.activeStandardId)||null; }
function activeSubject(){ const std=activeStandard(); return std? (std.subjects.find(s=>s.id===state.ui.activeSubjectId)||null):null; }
function evalsFor(stdId,subId,stuId){ return state.evals.filter(e=>e.standardId===stdId&&e.subjectId===subId&&(!stuId||e.studentId===stuId)).sort((a,b)=>a.date.localeCompare(b.date)); }
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function addMonths(date,n){const x=new Date(date);const day=x.getDate();x.setMonth(x.getMonth()+n);if(x.getDate()<day)x.setDate(0);return x;}
function isoDate(x){return x.toISOString().slice(0,10);}

/* ---------- theme + avatar ---------- */
function applyTheme(){ const t=state.settings.theme||"light"; document.body.setAttribute("data-theme",t);
  const tb=document.getElementById("themeBtn"); if(tb) tb.textContent=t==="dark"?"☀️":"🌙";
  if(window.Chart){ Chart.defaults.color=t==="dark"?"#9aa0a0":"#6b6f6a"; Chart.defaults.borderColor=t==="dark"?"#2b3036":"#e7e2d8"; } }
function toggleTheme(){ state.settings.theme=(state.settings.theme==="dark")?"light":"dark"; save(); applyTheme(); if(state.ui.tab==="trends"&&_chart) drawTrend(); }
function renderAvatar(){ const el=$("#hdrAvatar"); if(!el)return; const dp=state.settings.dp; const name=(state.settings.teacherName||state.auth?.username||"T").trim();
  el.innerHTML=dp?`<img src="${dp}" alt="">`:esc(name.slice(0,1).toUpperCase()); }

/* ---------- auth (local device lock) ---------- */
async function hashPw(pw,salt,method){
  if(method==="sha256"&&window.crypto&&crypto.subtle){
    const buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));
    return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  let h=5381; const s=salt+":"+pw; for(let i=0;i<s.length;i++){h=((h<<5)+h)+s.charCodeAt(i);h|=0;} return "b"+(h>>>0).toString(16);
}
function randSalt(){ const a=(window.crypto&&crypto.getRandomValues)?crypto.getRandomValues(new Uint8Array(8)):Array.from({length:8},()=>Math.floor(Math.random()*256)); return [...a].map(b=>b.toString(16).padStart(2,"0")).join(""); }
function showGate(html){ document.body.classList.add("gated"); const g=$("#gate"); g.innerHTML=html; g.style.display="flex"; }
function hideGate(){ document.body.classList.remove("gated"); $("#gate").style.display="none"; }
function unlockApp(){ try{sessionStorage.setItem("ct_unlocked","1");}catch(e){} boot(); }
function lockApp(){ try{sessionStorage.removeItem("ct_unlocked");}catch(e){} renderLock(); }
function boot(){ applyTheme();
  if(!state.auth){ renderCreate(); return; }
  let ok=false; try{ok=sessionStorage.getItem("ct_unlocked")==="1";}catch(e){}
  if(!ok){ renderLock(); return; }
  if(!subActive()){ renderPaywall(); return; }
  hideGate(); render();
}
function renderCreate(){
  showGate(`<div class="gatecard">
    <div class="mark">Class<b>Insights</b></div>
    <h3>Create your login</h3>
    <div class="sub">Set a username and password to lock this app on this device.</div>
    <label class="fld">Username</label><input id="cuUser" type="text" autocomplete="off" placeholder="e.g. ms.rahman">

async function doCreate(){

  if(u.length<3)return err.textContent="Username must be at least 3 characters.";

  if(p!==p2)return err.textContent="Passwords do not match.";
  const method=(window.crypto&&crypto.subtle)?"sha256":"basic",salt=randSalt();
  state.auth={username:u,salt,method,hash:await hashPw(p,salt,method)}; save(); unlockApp();
}
function renderLock(){

}
async function doUnlock(){ const a=state.auth; const h=await hashPw($("#lkPw").value,a.salt,a.method); if(h===a.hash) unlockApp(); else $("#lkErr").textContent="Incorrect password."; }

    const g=gradeFor(overall);

    const nextUp=sub.syllabus.find(t=>t.status==="upcoming");
    const perStu=std.students.map(st=>{ const r=evalsFor(std.id,sub.id,st.id); if(!r.length)return null; const p=pctFor(r[r.length-1].scores,els); return {st,p,g:gradeFor(p)}; }).filter(Boolean).sort((a,b)=>a.p-b.p);
    const focus=perStu.filter(x=>x.p<65).slice(0,5);
    snap=`<div class="grid two">
      <div class="card lift"><div class="badge">${esc(std.name)} · ${esc(sub.name)}</div>
        <div class="flex" style="gap:24px;margin:12px 0 4px;align-items:flex-end;flex-wrap:wrap">
          <div class="stat"><span class="v" style="font-size:48px;color:var(--teal)">${rows.length?g.grade:"—"}</span><span class="k">Class average${rows.length?` · ${overall}%`:""}</span></div>
          <div style="flex:1;min-width:180px">
            <div class="between" style="font-size:13px;margin-bottom:6px"><span class="muted">Syllabus coverage</span><b>${cov}%</b></div>
            <div class="progress"><i style="width:${cov}%"></i></div>
            <div class="muted" style="font-size:13px;margin-top:12px">Next up: <b style="color:var(--gold)">${nextUp?esc(nextUp.topic):"—"}</b></div>
          </div>
        </div><hr class="sep">
        <div class="flex" style="flex-wrap:wrap"><button class="btn sm" onclick="setTab('evaluate')">+ New evaluation</button><button class="btn gray sm" onclick="setTab('trends')">View trends</button><button class="btn gray sm" onclick="setTab('reports')">Generate report</button></div>
      </div>
      <div class="card lift"><h3>Needs attention</h3><div class="sub">Lowest recent marks in this subject.</div>
        ${focus.length?focus.map(x=>`<div class="between" style="padding:9px 0;border-bottom:1px solid var(--line)"><b>${esc(x.st.name)}</b><span class="flex"><span class="muted">${x.p}%</span><span class="pill ${x.p<50?'missed':'upcoming'}">${x.g.grade}</span></span></div>`).join(""):`<div class="muted" style="padding:12px 0">No marks yet, or everyone is on track.</div>`}
      </div>
    </div>`;
  } else {
    snap=`<div class="empty"><h3>Add a subject to get started</h3><p>${std?esc(std.name)+" has no subjects yet.":"Pick a class."} Add one under Setup to see its snapshot here.</p><div style="margin-top:12px"><button class="btn" onclick="setTab('setup')">Go to Setup</button></div></div>`;

  const covText=covLines.length?covLines.slice(0,8).join("&nbsp; · &nbsp;"):"Add syllabus topics to start tracking coverage.";

  return `<div class="hero"><span class="deco a"></span><span class="deco b"></span><h2>${greet}, ${name}</h2><p>Here's an overview of your classes and where things stand today.</p><div class="hero-cov">Syllabus progress &nbsp;—&nbsp; ${covText}</div></div>
  ${tilesHtml}

      <td class="right nowrap"><button class="btn ghost sm" onclick="state.ui.activeSubjectId='${sb.id}';setTab('syllabus')">Syllabus</button><button class="iconbtn" onclick="renameSubject('${sb.id}')">✎</button><button class="iconbtn" onclick="delSubject('${sb.id}')">🗑</button></td></tr>`).join("")
      :`<tr><td colspan="3" class="muted">No subjects yet.</td></tr>`;
    panel=`<div class="grid two">
      <div class="card"><h3>Students · ${esc(std.name)}</h3><div class="sub">Enrolled in every subject of this class. Parent name (optional) is used on reports.</div>
        <div class="row"><div><label class="fld">Student name</label><input id="stName" type="text" placeholder="e.g. Aisha Rahman"></div>
        <div><label class="fld">Parent / guardian</label><input id="stParent" type="text" placeholder="optional"></div>
        <div style="flex:0 0 auto"><button class="btn" onclick="addStudent()">+ Add</button></div></div>
        <hr class="sep"><div class="scroll"><table><thead><tr><th>Student</th><th>Parent / guardian</th><th class="right">Actions</th></tr></thead><tbody>${stuRows}</tbody></table></div></div>
      <div class="card"><h3>Subjects · ${esc(std.name)}</h3><div class="sub">Each subject keeps its own syllabus and marks for this class.</div>
        <div class="row"><div><label class="fld">Subject name</label><input id="subjName" type="text" placeholder="e.g. English Language"></div>
        <div style="flex:0 0 auto"><button class="btn" onclick="addSubject()">+ Add</button></div></div>
        <hr class="sep"><div class="scroll"><table><thead><tr><th>Subject</th><th>Syllabus</th><th class="right">Actions</th></tr></thead><tbody>${subRows}</tbody></table></div></div>
    </div>`;
  }

  let elHtml="";
  if(std && activeSubject()){
    const sub=activeSubject(), els=sub.elements, total=els.reduce((a,e)=>a+(Number(e.weight)||0),0);
    const libOpts=state.elementLibrary.filter(l=>!els.some(e=>e.key===l.key)).map(l=>`<option value="${l.key}">${esc(l.label)}</option>`).join("");
    const erows=els.length?els.map((e,i)=>`<tr><td><span class="dot" style="background:${elColor(i)}"></span> <b>${esc(e.label)}</b></td><td style="max-width:130px"><input type="number" min="0" max="100" step="1" value="${e.weight}" onchange="setElWeight('${e.key}',this.value)"></td><td class="right nowrap"><button class="iconbtn" onclick="moveEl('${e.key}',-1)">▲</button><button class="iconbtn" onclick="moveEl('${e.key}',1)">▼</button><button class="iconbtn" onclick="removeEl('${e.key}')">🗑</button></td></tr>`).join(""):`<tr><td colspan="3" class="muted">No elements — add at least one.</td></tr>`;
    elHtml=`<div class="card"><div class="between"><div><h3>Assessment elements · ${esc(sub.name)}</h3><div class="sub">Pick what this subject is marked on and the weight (%) each contributes. The grade follows the weighted percentage.</div></div><span class="pill ${total===100?'covered':'upcoming'}">Total ${total}%</span></div>
      <div class="row"><div><label class="fld">Add from library</label><select id="elPick">${libOpts||'<option value="">All added</option>'}</select></div><div style="flex:0 0 auto"><button class="btn gray" onclick="addElFromLib()">+ Add</button></div><div><label class="fld">Or create new element</label><input id="elNew" type="text" placeholder="e.g. Practical Skills"></div><div style="flex:0 0 auto"><button class="btn gray" onclick="addElCustom()">+ Create</button></div><div style="flex:0 0 auto"><button class="btn ghost" onclick="distributeWeights()">Distribute equally</button></div></div>

  return `

function setElWeight(key,v){ const sub=activeSubject(); const e=sub.elements.find(x=>x.key===key); if(e){ e.weight=Math.max(0,Math.min(100,Number(v)||0)); save(); render(); } }
function moveEl(key,dir){ const sub=activeSubject(); const i=sub.elements.findIndex(x=>x.key===key),j=i+dir; if(j<0||j>=sub.elements.length)return; [sub.elements[i],sub.elements[j]]=[sub.elements[j],sub.elements[i]]; save(); render(); }
function removeEl(key){ const sub=activeSubject(); if(sub.elements.length<=1)return toast("Keep at least one element"); sub.elements=sub.elements.filter(x=>x.key!==key); save(); render(); }
function addElFromLib(){ const sub=activeSubject(); const key=$("#elPick").value; if(!key)return; const lib=state.elementLibrary.find(l=>l.key===key); if(!lib||sub.elements.some(e=>e.key===key))return; sub.elements.push({key:lib.key,label:lib.label,weight:0}); save(); render(); }
function addElCustom(){ const sub=activeSubject(); const label=$("#elNew").value.trim(); if(!label)return toast("Enter an element name"); const key=slug(label); if(sub.elements.some(e=>e.key===key))return toast("Already added"); if(!state.elementLibrary.some(l=>l.key===key)) state.elementLibrary.push({key,label}); sub.elements.push({key,label,weight:0}); save(); render(); toast("Element added"); }
function distributeWeights(){ const sub=activeSubject(); const n=sub.elements.length; if(!n)return; const base=Math.floor(100/n); sub.elements.forEach(e=>e.weight=base); sub.elements[0].weight+=100-base*n; save(); render(); }
function addStandard(){ const n=$("#newStd").value.trim(); if(!n)return toast("Enter a class name"); const std={id:uid(),name:n,students:[],subjects:[]}; state.standards.push(std); state.ui.activeStandardId=std.id; state.ui.activeSubjectId=null; save(); render(); toast("Class added"); }
function renameStandard(id){ const s=state.standards.find(x=>x.id===id); const n=prompt("Rename class/standard",s.name); if(n&&n.trim()){s.name=n.trim();save();render();} }
function delStandard(id){ const s=state.standards.find(x=>x.id===id); if(!confirm(`Delete "${s.name}" with all its subjects, students, marks and syllabus?`))return;
  state.standards=state.standards.filter(x=>x.id!==id); state.evals=state.evals.filter(e=>e.standardId!==id);
  if(state.ui.activeStandardId===id){ state.ui.activeStandardId=state.standards[0]?.id||null; state.ui.activeSubjectId=activeStandard()?.subjects[0]?.id||null; } save(); render(); toast("Class deleted"); }
function addStudent(){ const std=activeStandard(); if(!std)return; const n=$("#stName").value.trim(); if(!n)return toast("Enter a student name"); std.students.push({id:uid(),name:n,parent:$("#stParent").value.trim()}); save(); render(); toast("Student added"); }
function editStudent(id){ const std=activeStandard(); const st=std.students.find(x=>x.id===id); const n=prompt("Student name",st.name); if(n===null)return; if(n.trim())st.name=n.trim(); const p=prompt("Parent / guardian (optional)",st.parent||""); if(p!==null)st.parent=p.trim(); save(); render(); }
function delStudent(id){ const std=activeStandard(); const st=std.students.find(x=>x.id===id); if(!confirm(`Remove ${st.name} and their marks from ${std.name}?`))return; std.students=std.students.filter(x=>x.id!==id); state.evals=state.evals.filter(e=>!(e.standardId===std.id&&e.studentId===id)); save(); render(); toast("Student removed"); }
function addSubject(){ const std=activeStandard(); if(!std)return; const n=$("#subjName").value.trim(); if(!n)return toast("Enter a subject name"); const sub={id:uid(),name:n,syllabus:[],elements:makeDefaultElements()}; std.subjects.push(sub); state.ui.activeSubjectId=sub.id; save(); render(); toast("Subject added"); }
function renameSubject(id){ const std=activeStandard(); const sb=std.subjects.find(x=>x.id===id); const n=prompt("Rename subject",sb.name); if(n&&n.trim()){sb.name=n.trim();save();render();} }
function delSubject(id){ const std=activeStandard(); const sb=std.subjects.find(x=>x.id===id); if(!confirm(`Delete "${sb.name}" with its syllabus and marks?`))return; std.subjects=std.subjects.filter(x=>x.id!==id); state.evals=state.evals.filter(e=>!(e.standardId===std.id&&e.subjectId===id)); if(state.ui.activeSubjectId===id) state.ui.activeSubjectId=std.subjects[0]?.id||null; save(); render(); toast("Subject deleted"); }

function viewEvaluate(){
  const need=needContext("subject"); if(need)return need;
  const std=activeStandard(),sub=activeSubject();
  if(!std.students.length) return emptyMsg(`No students in ${esc(std.name)}`,"Add students under Setup, then record marks here.");
  const m=state.settings.maxScore, els=sub.elements;
  const sessions=[...new Set(evalsFor(std.id,sub.id).map(e=>e.date+"|"+(e.session||"")))].sort().reverse().map(k=>{const[d,s]=k.split("|");return{date:d,session:s};});
  const sessOptions=`<option value="">— New session —</option>`+sessions.map(s=>`<option value="${s.date}|${esc(s.session)}">${fmt(s.date)}${s.session?" · "+esc(s.session):""}</option>`).join("");
  const topicOptions=`<option value="">— None / not linked —</option>`+sub.syllabus.map(t=>`<option value="${t.id}">${esc(t.topic)}${t.status==="covered"?" ✓":""}</option>`).join("");
  const rows=std.students.map(st=>{
    const cells=els.map(e=>`<td class="num"><input data-st="${st.id}" data-sk="${e.key}" type="number" min="0" max="${m}" step="0.5" oninput="liveGrade('${st.id}')"></td>`).join("");

function rankingCard(std,sub,els){

    const r=evalsFor(std.id,sub.id,st.id); if(!r.length)return null;

  const body=ranked.length?`<div class="scroll"><table><thead><tr><th>Rank</th><th>Student</th><th class="right">Average</th><th class="right">Grade</th><th class="right">Sessions</th></tr></thead><tbody>`+
    ranked.map((x,i)=>{const rk=i+1;const pc=x.avg<50?'missed':x.avg<65?'upcoming':'covered';return `<tr class="${rk<=3?'rank-top':''}"><td><span class="rankbadge r${rk<=3?rk:'n'}">${rk}</span></td><td><b>${esc(x.st.name)}</b></td><td class="right">${x.avg}%</td><td class="right"><span class="pill ${pc}">${x.g.grade}</span></td><td class="right muted">${x.sessions}</td></tr>`;}).join("")+
    `</tbody></table></div>`:`<div class="muted" style="padding:14px 0">No marks recorded yet. Save a session above and the class ranking appears here.</div>`;
  return `<div class="card lift" style="margin-top:18px">
    <div class="between" style="flex-wrap:wrap;gap:10px"><div><h3>Class performance</h3><div class="sub">Students ranked by their average across all recorded sessions in this subject.</div></div>
    <button class="btn" ${ranked.length?"":"disabled"} onclick="downloadRanking()">⬇ Download report</button></div>

}

function liveGrade(stId){
  const els=activeSubject().elements; const sc={}; let any=false;
  els.forEach(e=>{ const el=document.querySelector(`input[data-st="${stId}"][data-sk="${e.key}"]`); if(el&&el.value!=="")any=true; sc[e.key]=(el&&el.value!=="")?clampScore(el.value):0; });
  const g=$("#g_"+stId); if(!any){g.textContent="—";g.style.color="var(--muted)";return;}
  const b=gradeFor(pctFor(sc,els)); g.textContent=b.grade; g.style.color="var(--ink)"; g.title=b.label;
}
function loadSession(val){
  document.querySelectorAll('input[data-sk]').forEach(i=>i.value="");
  document.querySelectorAll('input[data-cm]').forEach(i=>i.value="");
  document.querySelectorAll('[id^="g_"]').forEach(g=>{g.textContent="—";g.style.color="var(--muted)";});
  if(!val){ $("#evSession").value=""; return; }
  const[date,session]=val.split("|"); $("#evDate").value=date; $("#evSession").value=session;
  const std=activeStandard(),sub=activeSubject(),els=sub.elements;
  evalsFor(std.id,sub.id).filter(e=>e.date===date&&(e.session||"")===session).forEach(e=>{
    els.forEach(el2=>{const el=document.querySelector(`input[data-st="${e.studentId}"][data-sk="${el2.key}"]`); if(el&&el2.key in e.scores)el.value=e.scores[el2.key];});
    const cm=document.querySelector(`input[data-st="${e.studentId}"][data-cm]`); if(cm)cm.value=e.comment||""; liveGrade(e.studentId);
  });
}
function saveSession(){
  const std=activeStandard(),sub=activeSubject(),els=sub.elements; const date=$("#evDate").value; if(!date)return toast("Pick a date");
  const session=$("#evSession").value.trim(),topicId=$("#evTopic").value; let count=0;
  std.students.forEach(st=>{
    const scores={}; let touched=false;
    els.forEach(e=>{const el=document.querySelector(`input[data-st="${st.id}"][data-sk="${e.key}"]`); if(el.value!=="")touched=true; scores[e.key]=el.value===""?0:clampScore(el.value);});
    const comment=document.querySelector(`input[data-st="${st.id}"][data-cm]`).value.trim();
    if(!touched&&!comment)return;
    const ex=state.evals.find(e=>e.standardId===std.id&&e.subjectId===sub.id&&e.studentId===st.id&&e.date===date&&(e.session||"")===session);
    if(ex){ ex.scores=scores; ex.comment=comment; ex.topicId=topicId||ex.topicId; }
    else state.evals.push({id:uid(),standardId:std.id,subjectId:sub.id,studentId:st.id,date,session,scores,comment,topicId});
    count++;
  });
  if($("#evMarkCovered").checked&&topicId){ const t=sub.syllabus.find(x=>x.id===topicId); if(t){t.status="covered";t.date=date;} }
  if(!count)return toast("Enter at least one mark");
  save(); render(); toast(`Saved marks for ${count} student${count!==1?"s":""}`);
}

let _chart=null;
function viewTrends(){
  const need=needContext("subject"); if(need)return need;
  const std=activeStandard(),sub=activeSubject();
  if(!std.students.length) return emptyMsg("No students yet","Add students and record sessions to see trends.");
  const all=evalsFor(std.id,sub.id); const minD=all.length?all[0].date:today();
  const sid=(state.ui.trendStudent&&std.students.find(s=>s.id===state.ui.trendStudent))?state.ui.trendStudent:std.students[0].id;
  const studOpts=std.students.map(st=>`<option value="${st.id}" ${st.id===sid?"selected":""}>${esc(st.name)}</option>`).join("");
  window._after=()=>drawTrend();
  return `
  <div class="page-head"><div><h2>Trends</h2><p><span class="tag">${esc(std.name)}</span> <span class="tag">${esc(sub.name)}</span> &nbsp;Progress across the five skills over any date range.</p></div></div>
  <div class="card">
    <div class="row">
      <div><label class="fld">Student</label><select id="trStud" onchange="state.ui.trendStudent=this.value;save();drawTrend()">${studOpts}</select></div>
      <div style="max-width:180px"><label class="fld">From</label><input id="trFrom" type="date" value="${minD}" onchange="drawTrend()"></div>
      <div style="max-width:180px"><label class="fld">To</label><input id="trTo" type="date" value="${today()}" onchange="drawTrend()"></div>
    </div>
    <hr class="sep"><div style="position:relative;height:360px"><canvas id="trendCanvas"></canvas></div>
    <div class="legend" id="trendLegend"></div>
  </div>
  <div id="trendStats"></div>`;
}
function getTrendData(){ const std=activeStandard(),sub=activeSubject(),sid=$("#trStud").value,from=$("#trFrom").value,to=$("#trTo").value; state.ui.trendStudent=sid;
  return {std,sub,sid,rows:evalsFor(std.id,sub.id,sid).filter(e=>(!from||e.date>=from)&&(!to||e.date<=to))}; }
function drawTrend(){
  const {sub,rows}=getTrendData(); const els=sub.elements; const m=state.settings.maxScore;
  const labels=rows.map(e=>fmt(e.date)+(e.session?` · ${e.session}`:""));
  const ds=els.map((el,i)=>({label:el.label,data:rows.map(e=>(el.key in e.scores)?e.scores[el.key]:null),borderColor:elColor(i),backgroundColor:elColor(i),tension:.3,pointRadius:3,borderWidth:2,spanGaps:true}));
  ds.push({label:"Weighted mark",data:rows.map(e=>Math.round(pctFor(e.scores,els)/100*m*10)/10),borderColor:AVG_COLOR,backgroundColor:AVG_COLOR,borderWidth:3,tension:.3,pointRadius:4});
  if(_chart){_chart.destroy();_chart=null;}
  const ctx=$("#trendCanvas");
  if(!rows.length){ ctx.getContext("2d").clearRect(0,0,ctx.width,ctx.height); $("#trendLegend").innerHTML='<span class="muted">No marks in this range.</span>'; $("#trendStats").innerHTML=""; return; }
  _chart=new Chart(ctx,{type:"line",data:{labels,datasets:ds},options:{responsive:true,maintainAspectRatio:false,animation:false,interaction:{mode:"index",intersect:false},
    scales:{y:{beginAtZero:true,max:m,title:{display:true,text:`Mark (out of ${m})`}},x:{ticks:{maxRotation:40}}},plugins:{legend:{display:false}}}});
  $("#trendLegend").innerHTML=ds.map(d=>`<span><i class="dot" style="background:${d.borderColor}"></i>${d.label}</span>`).join("");
  const avgPer=els.map(el=>{ const vals=rows.filter(r=>el.key in r.scores).map(r=>Number(r.scores[el.key])||0); return {el,v:vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length*10)/10:0}; });
  const overallPct=Math.round(rows.reduce((a,e)=>a+pctFor(e.scores,els),0)/rows.length*10)/10; const g=gradeFor(overallPct);
  const half=Math.max(1,Math.floor(rows.length/2));
  const arrow=k=>{ const present=rows.filter(r=>k in r.scores); if(present.length<2)return ""; const f=present.slice(0,Math.max(1,Math.floor(present.length/2))),l=present.slice(-Math.max(1,Math.floor(present.length/2)));
    const a=f.reduce((x,e)=>x+(e.scores[k]||0),0)/f.length,b=l.reduce((x,e)=>x+(e.scores[k]||0),0)/l.length,d=b-a;
    if(d>0.4)return `<span style="color:var(--ok)">▲ improving</span>`; if(d<-0.4)return `<span style="color:var(--danger)">▼ declining</span>`; return `<span class="muted">→ steady</span>`; };
  $("#trendStats").innerHTML=`<div class="card"><h3>Summary for this period</h3><div class="sub">${rows.length} session${rows.length!==1?"s":""} · ${fmt(rows[0].date)} – ${fmt(rows[rows.length-1].date)}</div>
    <div class="statgrid"><div class="stat"><span class="v">${g.grade}</span><span class="k">Overall grade</span></div><div class="stat"><span class="v">${overallPct}%</span><span class="k">${g.label}</span></div></div><hr class="sep">
    <div class="scroll"><table><thead><tr><th>Element</th><th class="right">Weight</th><th class="right">Average</th><th class="right">Out of</th><th>Trend</th></tr></thead>
    <tbody>${avgPer.map(x=>`<tr><td>${esc(x.el.label)}</td><td class="right muted">${x.el.weight||0}%</td><td class="right"><b>${x.v}</b></td><td class="right muted">${m}</td><td>${arrow(x.el.key)}</td></tr>`).join("")}</tbody></table></div></div>`;
}

function reportData(){
  const std=activeStandard(),sub=activeSubject(),sid=$("#rpStud").value,from=$("#rpFrom").value,to=$("#rpTo").value,els=sub.elements;
  const st=std.students.find(x=>x.id===sid);

  const overallPct=rows.length?Math.round(rows.reduce((a,e)=>a+pctFor(e.scores,els),0)/rows.length*10)/10:0;

function autoComment(d){
  if(!d.rows.length)return "No marks recorded for this period.";
  const half=Math.max(1,Math.floor(d.rows.length/2));
  const trend=k=>{const f=d.rows.slice(0,half),l=d.rows.slice(-half);return l.reduce((x,e)=>x+(e.scores[k]||0),0)/l.length-f.reduce((x,e)=>x+(e.scores[k]||0),0)/f.length;};
  const sorted=[...d.avgPer].sort((a,b)=>b.v-a.v), strength=sorted[0], focus=sorted[sorted.length-1];
  const improving=d.els.filter(e=>trend(e.key)>0.4).map(e=>e.label);
  let t=`${d.st.name} has shown ${d.grade.label.toLowerCase()} performance in ${d.sub.name} this period, achieving an overall grade of ${d.grade.grade} (${d.overallPct}%) across ${d.rows.length} assessment${d.rows.length!==1?"s":""}. `;
  t+=`${d.st.name.split(" ")[0]}'s strongest area is ${strength.el.label.toLowerCase()}. `;
  if(improving.length)t+=`Encouraging progress is visible in ${improving.join(", ").toLowerCase()}. `;
  t+=`With continued practice, ${focus.el.label.toLowerCase()} is the area to focus on next term. Thank you for your continued support at home.`;
  return t;
}
function buildReport(){
  const d=reportData(), draft=autoComment(d);
  $("#rpPreview").innerHTML=`<div class="card">
    <div class="between"><div><h3>Report preview — ${esc(d.st.name)}</h3><div class="sub">${esc(d.std.name)} · ${esc(d.sub.name)} · ${fmt(d.from)} – ${fmt(d.to)} · ${d.rows.length} assessment${d.rows.length!==1?"s":""}</div></div>
      <div class="stat right"><span class="v">${d.grade.grade}</span><span class="k">${d.overallPct}% · ${d.grade.label}</span></div></div><hr class="sep">
    <div class="scroll"><table><thead><tr><th>Element</th><th class="right">Weight</th><th class="right">Average</th><th class="right">Out of</th></tr></thead>
      <tbody>${d.avgPer.map(x=>`<tr><td>${esc(x.el.label)}</td><td class="right muted">${x.el.weight||0}%</td><td class="right"><b>${x.v}</b></td><td class="right muted">${state.settings.maxScore}</td></tr>`).join("")}</tbody></table></div><hr class="sep">
    <label class="fld">Comments for parents (edit before downloading)</label><textarea id="rpComment" style="min-height:120px">${esc(draft)}</textarea>
    <div class="between" style="margin-top:14px"><span class="muted" style="font-size:12px">Syllabus coverage: ${d.covered}/${d.sub.syllabus.length} topics · Grades: ${BANDS.map(b=>b.grade+"="+b.label).join(" · ")}</span>
      <button class="btn" onclick="downloadPDF()" ${d.rows.length?"":"disabled"}>⬇ Download PDF report</button></div></div>`;
}
async function downloadPDF(){
  const d=reportData(); if(!d.rows.length)return toast("No marks in this range");
  if(!window.jspdf)return toast("PDF library not loaded — check internet connection");
  const comment=$("#rpComment").value.trim();
  const cv=document.createElement("canvas"); cv.width=900; cv.height=420;
  const labels=d.rows.map(e=>fmt(e.date));
  const els=d.els;
  const ds=els.map((el,i)=>({label:el.label,data:d.rows.map(e=>(el.key in e.scores)?e.scores[el.key]:null),borderColor:elColor(i),backgroundColor:elColor(i),tension:.3,pointRadius:3,borderWidth:2,spanGaps:true}));
  ds.push({label:"Weighted mark",data:d.rows.map(e=>Math.round(pctFor(e.scores,els)/100*state.settings.maxScore*10)/10),borderColor:AVG_COLOR,borderWidth:3,tension:.3,pointRadius:3});
  const tmp=new Chart(cv,{type:"line",data:{labels,datasets:ds},options:{responsive:false,animation:false,scales:{y:{beginAtZero:true,max:state.settings.maxScore}},plugins:{legend:{position:"bottom",labels:{boxWidth:12,font:{size:11}}}}}});
  const img=cv.toDataURL("image/png"); tmp.destroy();
  const {jsPDF}=window.jspdf; const doc=new jsPDF("p","pt","a4"); const W=doc.internal.pageSize.getWidth(),M=48; let y=54;
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(47,111,94);doc.text((state.settings.schoolName||"ClassInsights").toUpperCase(),M,y);
  doc.setTextColor(31,36,33);doc.setFontSize(20);doc.text("Student Progress Report",M,y+24);
  doc.setDrawColor(231,226,216);doc.line(M,y+34,W-M,y+34);y+=58;
  const meta=[["Student",d.st.name],["Parent / Guardian",d.st.parent||"—"],["Class",d.std.name],["Subject",d.sub.name],["Period",`${fmt(d.from)} – ${fmt(d.to)}`],["Phone",state.settings.phone||"—"]];
  meta.forEach((mm,i)=>{const col=i%2,xx=M+col*((W-2*M)/2),yy=y+Math.floor(i/2)*30;doc.setTextColor(150,150,145);doc.setFontSize(8);doc.text(mm[0].toUpperCase(),xx,yy);doc.setTextColor(31,36,33);doc.setFontSize(12);doc.setFont("helvetica","bold");doc.text(String(mm[1]),xx,yy+15);doc.setFont("helvetica","normal");});
  y+=Math.ceil(meta.length/2)*30+18;
  doc.setFillColor(243,239,230);doc.roundedRect(M,y,W-2*M,56,8,8,"F");
  doc.setTextColor(47,111,94);doc.setFont("helvetica","bold");doc.setFontSize(28);doc.text(d.grade.grade,M+18,y+38);
  doc.setTextColor(31,36,33);doc.setFontSize(13);doc.text(`${d.overallPct}%  ·  ${d.grade.label}`,M+58,y+30);
  doc.setTextColor(107,111,106);doc.setFont("helvetica","normal");doc.setFontSize(9);doc.text(`${d.rows.length} assessment(s)  ·  Syllabus coverage: ${d.covered}/${d.sub.syllabus.length} topics`,M+58,y+46);
  y+=74;
  doc.autoTable({startY:y,margin:{left:M,right:M},head:[["Element","Weight","Average","Out of"]],body:d.avgPer.map(x=>[x.el.label,(x.el.weight||0)+"%",String(x.v),String(state.settings.maxScore)]),theme:"grid",headStyles:{fillColor:[47,111,94],fontSize:9},bodyStyles:{fontSize:10},columnStyles:{1:{halign:"right"},2:{halign:"right"},3:{halign:"right",textColor:[150,150,145]}}});
  y=doc.lastAutoTable.finalY+22;
  if(y>560){doc.addPage();y=54;}
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.setTextColor(31,36,33);doc.text("Progress over time",M,y);y+=10;
  const iw=W-2*M,ih=iw*(420/900);doc.addImage(img,"PNG",M,y,iw,ih);y+=ih+24;
  if(y>650){doc.addPage();y=54;}
  doc.setFont("helvetica","bold");doc.setFontSize(11);doc.text("Comments for parents",M,y);y+=16;
  doc.setFont("helvetica","normal");doc.setFontSize(10.5);doc.setTextColor(50,52,49);doc.text(doc.splitTextToSize(comment||"—",W-2*M),M,y);
  const ph=doc.internal.pageSize.getHeight();
  doc.setDrawColor(231,226,216);doc.line(M,ph-58,W-M,ph-58);
  doc.setFontSize(9);doc.setTextColor(107,111,106);
  doc.text(`Teacher: ${state.settings.teacherName||"____________________"}`,M,ph-38);
  doc.text(`Generated ${fmt(today())}`,W-M,ph-38,{align:"right"});
  doc.text("Signature: ____________________",W-M,ph-20,{align:"right"});
  doc.save(`${d.st.name.replace(/\s+/g,"_")}_${d.sub.name.replace(/\s+/g,"_")}_report.pdf`);
  toast("PDF downloaded");
}

/* ============================================================
   SETTINGS
   ============================================================ */
function viewSettings(){
  const s=state.settings,a=state.auth||{};
  const dpPrev=s.dp?`<span class="avatar lg"><img src="${s.dp}" alt=""></span>`:`<span class="avatar lg">${esc((s.teacherName||a.username||"T").trim().slice(0,1).toUpperCase())}</span>`;
  const active=subActive(),left=subDaysLeft(),until=state.license?.activeUntil;
  return `
  <div class="page-head"><div><h2>Settings</h2><p>Profile, appearance, marking scale, subscription and account.</p></div></div>
  <div class="grid two">
    <div class="card"><h3>Profile</h3><div class="sub">Name and photo show in the header; all fields appear on reports.</div>
      <div class="flex" style="gap:18px;margin:6px 0 14px"><div id="dpPrev">${dpPrev}</div>
        <div><input id="dpFile" type="file" accept="image/*" class="hide" onchange="uploadDP(this)">
          <button class="btn gray sm" onclick="document.getElementById('dpFile').click()">Upload photo</button>${s.dp?`<button class="btn danger sm" onclick="removeDP()">Remove</button>`:""}
          <div class="muted" style="font-size:12px;margin-top:6px">Square image works best.</div></div></div>
      <label class="fld">Teacher name</label><input id="seTeacher" type="text" value="${esc(s.teacherName)}" placeholder="e.g. Ms. Rahman">
      <label class="fld" style="margin-top:10px">School / centre</label><input id="seSchool" type="text" value="${esc(s.schoolName)}" placeholder="On report header">
      <label class="fld" style="margin-top:10px">Phone number</label><input id="sePhone" type="text" value="${esc(s.phone||"")}" placeholder="e.g. +60 12-345 6789">
      <button class="btn" style="margin-top:14px" onclick="saveProfile()">Save profile</button></div>
    <div class="card"><h3>Appearance</h3><div class="sub">Choose how ClassInsights looks.</div>
      <div class="flex" style="gap:10px"><button class="btn ${s.theme!=="dark"?"":"gray"}" onclick="setTheme('light')">☀️ Light</button><button class="btn ${s.theme==="dark"?"":"gray"}" onclick="setTheme('dark')">🌙 Dark</button></div>
      <hr class="sep"><h3>Marking scale</h3><div class="sub">Max mark per skill. Bands: ${BANDS.map(b=>`<b>${b.grade}</b> ${b.min}%+`).join(" · ")}</div>
      <label class="fld">Max mark per skill</label><select id="seMax" style="max-width:160px">${[5,10,20,25,50,100].map(v=>`<option ${v===s.maxScore?"selected":""}>${v}</option>`).join("")}</select>
      <div><button class="btn" style="margin-top:12px" onclick="saveMax()">Save scale</button></div></div>
  </div>
  <div class="card"><h3>Subscription</h3><div class="sub">Front-end demo of the monthly activation flow. For real sales this must be verified by a server (Stripe / Lemon Squeezy + backend).</div>
    <div class="between"><div class="flex"><span class="pill ${active?'covered':'missed'}">${active?'Active':'Inactive'}</span>
      <span class="muted">${until?(active?`Renews ${fmt(until)} · ${left} day${left!==1?'s':''} left`:`Expired ${fmt(until)}`):'Not activated'}</span></div>
      <div class="flex"><button class="btn sm" onclick="demoActivate()">${active?'Extend +1 month (demo)':'Activate (demo)'}</button>${active?`<button class="btn danger sm" onclick="demoCancel()">End now (demo)</button>`:""}</div></div></div>
  <div class="card"><h3>Account</h3><div class="sub">Signed in as <b>${esc(a.username||"")}</b>. Changing username or password requires your current password.</div>
    <div class="grid two">
      <div><label class="fld">New username</label><input id="acUser" type="text" placeholder="${esc(a.username||"")}">
        <label class="fld" style="margin-top:10px">Current password</label><input id="acUserPw" type="password" placeholder="Confirm with current password">
        <button class="btn gray" style="margin-top:12px" onclick="changeUsername()">Change username</button></div>
      <div><label class="fld">Current password</label><input id="acCur" type="password">
        <label class="fld" style="margin-top:10px">New password</label><input id="acNew" type="password">
        <label class="fld" style="margin-top:10px">Confirm new password</label><input id="acNew2" type="password">
        <button class="btn gray" style="margin-top:12px" onclick="changePassword()">Change password</button></div>
    </div><hr class="sep">
    <div class="between"><button class="btn ghost" onclick="lockApp()">🔒 Lock now</button>
      <div class="flex"><button class="btn gray sm" onclick="loadDemo()">Load demo data</button><button class="btn danger sm" onclick="wipe()">Clear all data</button></div></div></div>`;
}
function saveProfile(){ state.settings.teacherName=$("#seTeacher").value.trim(); state.settings.schoolName=$("#seSchool").value.trim(); state.settings.phone=$("#sePhone").value.trim(); save(); render(); toast("Profile saved"); }
function saveMax(){ state.settings.maxScore=Number($("#seMax").value)||10; save(); render(); toast("Marking scale saved"); }
function setTheme(t){ state.settings.theme=t; save(); render(); }
function uploadDP(input){ const f=input.files[0]; if(!f)return; const img=new Image(),rd=new FileReader();
  rd.onload=()=>{ img.onload=()=>{ const c=document.createElement("canvas"),sz=256,m=Math.min(img.width,img.height); c.width=sz;c.height=sz; const ctx=c.getContext("2d"); ctx.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,sz,sz); state.settings.dp=c.toDataURL("image/jpeg",0.85); save(); render(); toast("Photo updated"); }; img.src=rd.result; };
  rd.readAsDataURL(f); }
function removeDP(){ state.settings.dp=""; save(); render(); toast("Photo removed"); }
async function changeUsername(){ const nu=$("#acUser").value.trim(),pw=$("#acUserPw").value,a=state.auth; if(nu.length<3)return toast("Username must be 3+ characters"); if(await hashPw(pw,a.salt,a.method)!==a.hash)return toast("Current password incorrect"); a.username=nu; save(); render(); toast("Username changed"); }
async function changePassword(){ const cur=$("#acCur").value,nw=$("#acNew").value,nw2=$("#acNew2").value,a=state.auth; if(await hashPw(cur,a.salt,a.method)!==a.hash)return toast("Current password incorrect"); if(nw.length<4)return toast("New password must be 4+ characters"); if(nw!==nw2)return toast("New passwords do not match"); a.salt=randSalt(); a.method=(window.crypto&&crypto.subtle)?"sha256":"basic"; a.hash=await hashPw(nw,a.salt,a.method); save(); render(); toast("Password changed"); }
function wipe(){ if(confirm("Delete ALL classes, students, marks and syllabus permanently? (Login, profile and subscription are kept.)")){ state.standards=[]; state.evals=[]; state.ui.activeStandardId=null; state.ui.activeSubjectId=null; save(); render(); toast("Gradebook data cleared"); } }

/* ---------- demo data ---------- */
function loadDemo(){
  if(state.standards.length && !confirm("Load a demo class alongside your existing data?"))return;
  const std={id:uid(),name:"Standard 4 — Hibiscus",students:[],subjects:[]};
  [["Aisha Rahman","Mr & Mrs Rahman"],["Daniel Lee","Mdm Tan"],["Priya Suresh","Mr Suresh"],["Arjun Nair","Mrs Nair"]].forEach(n=>std.students.push({id:uid(),name:n[0],parent:n[1]}));
  const eng={id:uid(),name:"English Language",syllabus:[],elements:[["Reading",25],["Listening",20],["Writing",25],["Speaking",20],["Grammar",10]].map(([l,w])=>({key:slug(l),label:l,weight:w}))};
  ["Unit 1 — Phonics & Reading Aloud","Unit 2 — Vocabulary Building","Unit 3 — Narrative Writing","Unit 4 — Listening Comprehension","Unit 5 — Oral Presentation","Unit 6 — Persuasive Writing","Unit 7 — Poetry","Unit 8 — Revision"].forEach((t,i)=>eng.syllabus.push({id:uid(),topic:t,status:i<3?"covered":(i===3?"missed":"upcoming"),date:i<3?addDays(-((3-i)*7)):""}));
  const math={id:uid(),name:"Mathematics",syllabus:[],elements:[["Calculation",40],["Problem Solving",35],["Reasoning",25]].map(([l,w])=>({key:slug(l),label:l,weight:w}))};
  ["Whole Numbers","Fractions","Decimals","Measurement","Geometry","Data Handling"].forEach((t,i)=>math.syllabus.push({id:uid(),topic:t,status:i<2?"covered":"upcoming",date:i<2?addDays(-((2-i)*7)):""}));
  std.subjects.push(eng,math); state.standards.push(std); state.ui.activeStandardId=std.id; state.ui.activeSubjectId=eng.id;
  [eng,math].forEach(sub=>{ for(let w=5;w>=0;w--){ const date=addDays(-(w*7)),session=`Week ${6-w}`;
    std.students.forEach((st,si)=>{ const base=5.3+si*0.5+(5-w)*0.35,sc={}; sub.elements.forEach((el,k)=>{sc[el.key]=Math.max(2,Math.min(state.settings.maxScore,Math.round((base+(k-2)*0.4+(Math.random()*1.2-0.6))*2)/2));}); state.evals.push({id:uid(),standardId:std.id,subjectId:sub.id,studentId:st.id,date,session,scores:sc,comment:""}); }); } });
  save(); render(); toast("Demo class loaded");
}

/* ---------- boot ---------- */
boot();
</script>
